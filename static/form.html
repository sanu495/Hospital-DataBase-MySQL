<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Patient</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background:linear-gradient(145deg, #93b2f7, #3360a8,#627ca7);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .form-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 16px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #6b7280;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-user-plus"></i> Add Patient</h1>
        </div>
        <form method="post" action="/patients/create" class="form-card">
            <div class="row">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input class="form-input" type="text" name="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input class="form-input" type="tel" name="phone" required placeholder="9876543210" maxlength="10">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label class="form-label">Age</label>
                    <input class="form-input" type="number" name="age" required min="1" max="120" placeholder="25">
                </div>
                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <select name="gender" required class="form-input">
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label class="form-label">Place</label>
                    <input class="form-input" type="text" name="place" required placeholder="City">
                </div>
                <div class="form-group">
                    <label class="form-label">Date</label>
                    <input type="date" name="admission_date" required class="form-input">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Doctor</label>
                <input class="form-input" type="text" name="doctor_name" required placeholder="Dr. Smith">
            </div>
            <div class="form-group">
                <label class="form-label">Status</label>
                <select name="status" required class="form-input">
                    <option value="">Select</option>
                    <option value="Active">Active</option>
                    <option value="Discharge">Discharge</option>
                    <option value="Critical">Critical</option>
                </select>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Add Patient
                </button>
            </div>
        </form>
    </div>
</body>

</html>
